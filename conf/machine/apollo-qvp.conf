# Apollo QVP currently matches the RD-Aspen FVP machine definition.
# Keep the fvp-rd-aspen override visible so existing non-kernel BSP
# recipes remain compatible while QVP-specific platform metadata lands.
MACHINEOVERRIDES =. "fvp-rd-aspen:"
NATIVE_MACHINE = "fvp-rd-aspen"

require conf/machine/fvp-rd-aspen.conf

KMACHINE = "apollo-qvp"
ARM_SYSTEMREADY_FIRMWARE = "firmware-apollo-qvp:do_deploy"
EXTRA_IMAGEDEPENDS:remove = "efi-capsule-update-disk-image-fvp-rd-aspen:do_deploy"
EXTRA_IMAGEDEPENDS += "${@bb.utils.contains('BUILD_UEFI_CAPSULE', '1', 'efi-capsule-update-disk-image-apollo-qvp:do_deploy', '', d)}"
FVP_CONFIG[ros.virtio_block1.image_path] = "${@bb.utils.contains('BUILD_UEFI_CAPSULE', '1', '${DEPLOY_DIR_IMAGE}/efi-capsule-update-disk-image-apollo-qvp.img', '', d)}"
