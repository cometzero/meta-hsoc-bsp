# Apollo FVP currently matches the RD-Aspen FVP machine definition.
# Keep the fvp-rd-aspen override visible so existing non-kernel BSP
# recipes remain compatible while the Apollo-specific machine evolves.
MACHINEOVERRIDES =. "fvp-rd-aspen:"
NATIVE_MACHINE = "fvp-rd-aspen"

require conf/machine/fvp-rd-aspen.conf

KMACHINE = "apollo-fvp"
ARM_SYSTEMREADY_FIRMWARE = "firmware-apollo-fvp:do_deploy"

WKS_FILE_DEPENDS:append:pn-nexios-image:auto-ad-nexios = " \
    auto-ad-nexios-systemd-boot-script \
"
IMAGE_EFI_BOOT_FILES:append:pn-nexios-image:auto-ad-nexios = " \
    ${AUTO_AD_NEXIOS_UKI_A};EFI/Linux/nexios-a.efi \
    ${AUTO_AD_NEXIOS_UKI_B};EFI/Linux/nexios-b.efi \
    auto-ad-nexios-systemd-boot.scr;auto-ad-nexios-systemd-boot.scr \
"
