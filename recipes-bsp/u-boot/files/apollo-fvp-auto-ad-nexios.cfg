CONFIG_BOOTCOMMAND="virtio scan; if aanxbootselect; then if load virtio 0:${aanx_boot_part} ${scriptaddr} auto-ad-nexios-systemd-boot.scr; then source ${scriptaddr}; else echo auto-ad-nexios: loading ${aanx_uki} from virtio 0:${aanx_boot_part}; if load virtio 0:${aanx_boot_part} ${loadaddr} ${aanx_uki}; then bootefi ${loadaddr}; fi; if test ${aanx_fallback_valid} = 1; then echo auto-ad-nexios: trying fallback ${aanx_fallback_uki}; if load virtio 0:${aanx_boot_part} ${loadaddr} ${aanx_fallback_uki}; then bootefi ${loadaddr}; fi; fi; fi; fi; bootflow scan"
